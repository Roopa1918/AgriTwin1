<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background hex/circle -->
  <rect width="100" height="100" rx="22" fill="#061a14" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Left: Agricultural Natural Leaf -->
  <path d="M50 16 C30 20 18 40 22 62 C26 78 40 84 50 84 C50 65 50 40 50 16 Z" fill="url(#leafGrad)" opacity="0.95" />
  
  <!-- Right: Digital Twin Cyber Leaf with Circuit Grid -->
  <path d="M50 16 C70 20 82 40 78 62 C74 78 60 84 50 84 C50 65 50 40 50 16 Z" fill="none" stroke="url(#techGrad)" stroke-width="3" />
  
  <!-- Central spine -->
  <line x1="50" y1="16" x2="50" y2="84" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Natural veins left -->
  <path d="M50 35 Q36 38 32 46" stroke="#065f46" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M50 50 Q38 54 34 64" stroke="#065f46" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Circuit traces right -->
  <polyline points="50,32 64,32 70,40" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="70" cy="40" r="3" fill="#38bdf8" />
  
  <polyline points="50,48 66,48 72,56" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="72" cy="56" r="3" fill="#38bdf8" />

  <polyline points="50,64 62,64 68,70" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="68" cy="70" r="2.5" fill="#38bdf8" />
  
  <!-- Digital Twin glowing node -->
  <circle cx="50" cy="16" r="4" fill="#34d399" />
</svg>